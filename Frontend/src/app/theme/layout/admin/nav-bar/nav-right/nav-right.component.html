<div class="ms-auto">
  <ul class="list-unstyled">
    <li>
      <div class="dropdown pc-h-item header-user-profile" ngbDropdown>
        <a
          class="pc-head-link head-link-primary dropdown-toggle arrow-none me-0"
          data-bs-toggle="dropdown"
          href="javascript:"
          ngbDropdownToggle
        >
          <img src="assets/images/user/310818.png" alt="user-image" class="user-avtar" />
          <span>
            <i class="ti ti-settings"></i>
          </span>
        </a>
        <div class="dropdown-menu dropdown-user-profile dropdown-menu-end pc-h-dropdown" ngbDropdownMenu>
          <div class="dropdown-header">
  <h4>
    Hello,
    <!-- Changed from currentUser?.Name to currentUser?.full_name -->
    <span class="small text-muted">{{ currentUser?.full_name || 'Guest' }}</span>
  </h4>
  
  <!-- Changed from CompanyName to email, as CompanyName isn't in your auth payload -->
  <p class="text-muted">{{ currentUser?.email || 'User' }}</p>
  
  <hr />
  <ng-scrollbar style="height: calc(70vh - 280px)" visibility="hover">
    <a [routerLink]="['/login']" class="dropdown-item">
      <i class="ti ti-logout"></i>
      <span>Logout</span>
    </a>
  </ng-scrollbar>
</div>
        </div>
      </div>
    </li>
  </ul>
</div>
