<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
          <h3 class="mb-4">My Profile</h3>

          <div *ngIf="errorMessage" class="alert alert-danger small">
            {{ errorMessage }}
          </div>
          <div *ngIf="successMessage" class="alert alert-success small">
            {{ successMessage }}
          </div>

          <form (ngSubmit)="saveProfile()">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="firstName" class="form-label small">First Name</label>
                <input type="text" id="firstName" class="form-control form-control-sm" [(ngModel)]="firstName" name="firstName" required />
              </div>
              <div class="col-md-6">
                <label for="lastName" class="form-label small">Last Name</label>
                <input type="text" id="lastName" class="form-control form-control-sm" [(ngModel)]="lastName" name="lastName" required />
              </div>
            </div>

            <div class="row g-3 mt-3">
              <div class="col-md-6">
                <label for="email" class="form-label small">Email</label>
                <input type="email" id="email" class="form-control form-control-sm" [(ngModel)]="email" name="email" required />
              </div>
              <div class="col-md-6">
                <label for="company" class="form-label small">Company</label>
                <input type="text" id="company" class="form-control form-control-sm" [(ngModel)]="company" name="company" />
              </div>
            </div>

            <div class="row g-3 mt-3">
              <div class="col-md-6">
                <label for="contact" class="form-label small">Contact</label>
                <input type="text" id="contact" class="form-control form-control-sm" [(ngModel)]="contact" name="contact" />
              </div>
            </div>

            <div class="mt-3">
              <label for="otherInfo" class="form-label small">Other Information</label>
              <textarea id="otherInfo" class="form-control form-control-sm" rows="3" [(ngModel)]="otherInfo" name="otherInfo"></textarea>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
              <button type="button" class="btn btn-outline-secondary btn-sm" (click)="router.navigate(['/data-import'])">Cancel</button>
              <button type="submit" class="btn btn-primary btn-sm" [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
